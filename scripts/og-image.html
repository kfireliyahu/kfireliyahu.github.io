<!doctype html>
<!--
  The link preview card, 1200x630, drawn by scripts/og-image.mjs into public/og.png.
  The opening of the home page, set small: domain, name, line, rule, what is being built now.
  Keep the words in step with site.name, intro.line and intro.now in src/data/copy.ts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Rubik';
        src: url('../node_modules/@fontsource-variable/rubik/files/rubik-latin-wght-normal.woff2') format('woff2-variations');
        font-weight: 300 900;
      }
      @font-face {
        font-family: 'Assistant';
        src: url('../node_modules/@fontsource-variable/assistant/files/assistant-latin-wght-normal.woff2') format('woff2-variations');
        font-weight: 200 800;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #0e1319;
        color: #e0e5eb;
        font-family: 'Assistant', sans-serif;
        padding: 64px 72px 60px;
        display: flex;
        flex-direction: column;
      }
      .label {
        font-family: 'Rubik', sans-serif;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8e9aab;
      }
      .name {
        margin-top: auto;
        font-family: 'Rubik', sans-serif;
        font-size: 115px;
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 0.92;
        white-space: nowrap;
      }
      .line {
        margin-top: 28px;
        font-size: 60px;
        font-weight: 300;
        letter-spacing: -0.01em;
        line-height: 1.05;
        color: #8e9aab;
        white-space: nowrap;
      }
      .rule { margin-top: 44px; height: 2px; background: #9fb3cc; opacity: 0.5; }
      .foot { margin-top: 24px; display: flex; gap: 0.75em; }
      .foot b { font-weight: 500; color: #d9a05a; }
    </style>
  </head>
  <body>
    <p class="label">kfireliyahu.com</p>
    <h1 class="name">Kfir Raphael Eliyahu</h1>
    <p class="line">Fixing problems with creative software</p>
    <div class="rule"></div>
    <p class="label foot"><span>Now building</span> <b>Emerald</b></p>
  </body>
</html>
